<!doctype html>
<html lang="he" dir="rtl" class="bg-paper">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1112" />
    <meta name="application-name" content="CoachOS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CoachOS" />
    <meta name="description" content="ניהול אימונים, תשלומים ותזכורות מהטלפון" />
    <title>CoachOS — ניהול אימונים</title>
    <script>
      try {
        if (localStorage.getItem('coach-theme') === 'ink') {
          document.documentElement.classList.add('theme-ink')
        }
      } catch (e) {}
    </script>
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script src="/env.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
