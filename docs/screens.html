<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoachOS — screenshots</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body { margin: 0; font-family: var(--font-assistant); background: var(--canvas); color: var(--ink); }
    main { max-width: 720px; margin: 0 auto; padding: 28px 16px 80px; }
    a.back { color: var(--court); font-weight: 700; }
    h1 { margin: 12px 0 8px; }
    p { color: var(--muted); }
    figure { margin: 24px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
    img { width: 100%; max-width: 390px; height: auto; display: block; border-radius: 12px; }
    figcaption { padding-top: 10px; font-weight: 700; }
    figcaption a { color: var(--court-strong); }
  </style>
</head>
<body>
  <main>
    <p><a class="back" href="index.html">← back to index</a></p>
    <h1>Screenshots</h1>
    <p>Dummy / design data only. No real coach or client phones.</p>

    <figure>
      <img src="screens/login.png" alt="CoachOS login">
      <figcaption><a href="screens/login.png">screens/login.png</a> — login (SMS OTP)</figcaption>
    </figure>
    <figure>
      <img src="screens/today.png" alt="Today screen with dummy sessions">
      <figcaption><a href="screens/today.png">screens/today.png</a> — Today with dummy clients</figcaption>
    </figure>
    <figure>
      <img src="screens/today-empty.png" alt="Today empty state">
      <figcaption><a href="screens/today-empty.png">screens/today-empty.png</a> — Today empty state</figcaption>
    </figure>
    <figure>
      <img src="screens/book.png" alt="Public booking page">
      <figcaption><a href="screens/book.png">screens/book.png</a> — public booking</figcaption>
    </figure>
    <figure>
      <img src="screens/confirm.png" alt="Public confirm page">
      <figcaption><a href="screens/confirm.png">screens/confirm.png</a> — public confirm arrival</figcaption>
    </figure>
    <figure>
      <img src="screens/ink.png" alt="Ink theme">
      <figcaption><a href="screens/ink.png">screens/ink.png</a> — Ink theme toggle</figcaption>
    </figure>
  </main>
</body>
</html>
